# Production intelligence refresh.
#
# HOURLY, as a 24-hour canary. Cadence is under evaluation and is not yet
# permanent; do not change it to 30 minutes without a separate decision.
#
# The job only reads the market database and writes the derived one. It cannot
# affect the five-minute collector: that runs on its own schedule, against a
# different database, and this workflow never opens a writable market handle.
#
# It runs on GitHub Actions rather than as a Vercel function because a seven-day
# refresh takes minutes and gigabytes, far beyond a serverless request budget.
# Nothing about the product's read path depends on where this runs: the job only
# writes the derived database and moves the active pointer.
name: intelligence-refresh

on:
  workflow_dispatch:
    inputs:
      no-activate:
        description: "Persist and validate, but leave the active pointer where it is"
        type: boolean
        default: false
  schedule:
    # Hourly at :20. GitHub may delay or drop a scheduled run under load, so
    # attempted runs can be fewer than expected runs; that is measured, not
    # corrected for. See docs/ops/INTELLIGENCE_REFRESH.md.
    - cron: "20 * * * *"

# A second refresh would be refused by the derived-database advisory lock
# anyway; this keeps a queued run from burning a runner to discover that.
concurrency:
  group: intelligence-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Read-only credentials for the market database. The job additionally
      # pins the connection READ ONLY and REPEATABLE READ, but the credential
      # itself should not be able to write.
      MARKET_ANALYTICS_SOURCE_URL: ${{ secrets.MARKET_ANALYTICS_SOURCE_URL }}
      DERIVED_MARKET_DATABASE_URL: ${{ secrets.DERIVED_MARKET_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Applies any unapplied derived migration. Checksum-pinned, so an edited
      # migration is refused rather than silently re-run.
      - run: npm run db:migrate:derived
      - name: Refresh
        # Peak resident memory for a seven-day scope is ~1.9 GB.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # --retain only takes effect after the run activated AND the pointer was
        # read back naming the snapshot it just built; otherwise the report says
        # SKIPPED. There is no retry: a failed hour waits for the next one, so a
        # persistent fault cannot turn into a hot loop against the market
        # database. The advisory lock makes an overlapping run exit immediately.
        run: |
          npm run analytics:refresh -- \
            --note "hourly canary $GITHUB_RUN_ID" \
            ${{ inputs.no-activate && '--no-activate' || '--retain' }}
      - name: Upload refresh report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-refresh-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/derived-market/refresh-*.json
          if-no-files-found: warn
